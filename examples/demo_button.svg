<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rectangle -->
  <rect id="bg" x="0" y="0" width="200" height="100" fill="#f0f0f0"/>

  <!-- Button background with rounded corners -->
  <rect id="button" x="20" y="20" width="160" height="60" rx="10" ry="10"
        fill="#4a90d9" stroke="#2d5a87" stroke-width="2"/>

  <!-- Button text -->
  <text id="buttonText" x="100" y="58"
        font-family="sans-serif" font-size="18" font-weight="bold"
        text-anchor="middle" fill="white">Click Me!</text>

  <!-- Counter display -->
  <text id="counter" x="100" y="90"
        font-family="monospace" font-size="12"
        text-anchor="middle" fill="#333">Count: 0</text>
</svg>
