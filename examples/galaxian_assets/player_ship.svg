  <!-- Cockpit -->
  <ellipse id="cockpit" cx="20" cy="16" rx="6" ry="8" fill="#ffffff" fill-opacity="0.4"/>
  <!-- Engine glow -->
  <rect x="16" y="26" width="8" height="6" fill="#ffff00" fill-opacity="0.8"/>
</svg>
