<?xml version="1.0" encoding="UTF-8"?>
<svg width="40" height="32" xmlns="http://www.w3.org/2000/svg">
  <!-- Player Ship - Classic Galaxian style fighter -->
  <!-- Main hull -->
  <polygon id="hull" points="20,0 40,28 35,32 20,26 5,32 0,28" fill="#00ffff"/>
  <!-- Wings -->
  <polygon id="wings" points="0,28 8,20 12,28" fill="#00cccc"/>
