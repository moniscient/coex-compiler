<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Shadow -->
  <rect x="8" y="8" width="84" height="84" rx="8" fill="#000000" fill-opacity="0.3"/>
  <!-- Main box -->
  <rect id="box" x="4" y="4" width="84" height="84" rx="8" fill="#e67e22"/>
  <!-- Border -->
  <rect id="border" x="4" y="4" width="84" height="84" rx="8" fill="none" stroke="#d35400" stroke-width="2"/>
  <!-- Drag handle icon (four arrows) -->
  <g id="handle" fill="#ffffff">
    <rect x="45" y="30" width="10" height="40"/>
    <rect x="30" y="45" width="40" height="10"/>
    <polygon points="50,20 42,32 58,32"/>
    <polygon points="50,80 42,68 58,68"/>
    <polygon points="20,50 32,42 32,58"/>
    <polygon points="80,50 68,42 68,58"/>
  </g>
</svg>
