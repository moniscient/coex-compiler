[pytest]
testpaths = tests
norecursedirs = examples .git __pycache__ *.egg-info
timeout = 60
# By default, ignore slow and stress test directories
# Use --ignore-glob= to override, or run specific paths directly
addopts = --ignore=tests/slow --ignore=tests/stress --ignore=tests/ui
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    stress: marks tests as stress tests (deselect with '-m "not stress"')
