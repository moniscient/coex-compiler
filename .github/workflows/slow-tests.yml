# Coex Compiler Slow Tests
#
# Runs long-running stress tests that are too slow for regular CI
# Triggered manually or weekly on Sundays

name: Slow Tests

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC

jobs:
  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm
        clang --version

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build runtime libraries
      run: |
        cd runtime && make clean && make
        ls -la *.a

    - name: Run slow tests
      run: |
        python -m pytest tests/slow/ -v --tb=short
