# Coex Compiler CI Pipeline
#
# Runs on every push and pull request:
# 1. Install dependencies
# 2. Run all tests
# 3. Verify example programs compile and run correctly

name: Coex CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm
        echo "=== System versions ==="
        clang --version
        llvm-config --version || echo "llvm-config not found"
        echo "=== Python llvmlite info ==="
        python -c "import llvmlite; print(f'llvmlite version: {llvmlite.__version__}')" || echo "llvmlite not yet installed"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-xdist  # For parallel test execution

    - name: Build runtime libraries
      run: |
        cd runtime && make clean && make
        ls -la *.a

    - name: Verify llvmlite works
      run: |
        python -c "
import llvmlite.binding as llvm
import llvmlite.ir as ir
print(f'llvmlite version: {llvm.llvmlite_version}')
print(f'LLVM version: {llvm.llvm_version_info}')
# Quick sanity check
module = ir.Module(name='test')
print('llvmlite IR generation works')
"

    - name: Run quick sanity test
      run: |
        # Run a single simple test to verify compiler works before full suite
        python -m pytest tests/test_basic.py::TestHelloWorld -v --tb=long

    - name: Run tests
      run: |
        # Skip tests requiring task-to-task suspension (not fully implemented yet)
        # These tests need state machine coroutine features that are still in progress
        # Also skip tests/slow/ which contains long-running stress tests
        #
        # Use --tb=long for detailed failure info on CI
        # Use -n auto for parallel execution (pytest-xdist)
        python -m pytest tests/ -v --tb=long -n auto \
          --ignore=tests/slow \
          --ignore=tests/test_task_state_machine.py \
          --ignore=tests/test_task_to_task.py \
          --ignore=tests/test_task_channel.py \
          --ignore=tests/test_complex_first_most.py \
          --ignore=tests/test_scheduler.py \
          --ignore=tests/test_thread_channel.py \
          --ignore=tests/test_channel_inference.py
